[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tecnomata-iptv"
version = "0.1.0"
description = "Cliente IPTV personal para Linux, Qt y libmpv"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.10,<7", "python-mpv>=1.0.8,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
tecnomata-iptv = "tecnomata_iptv.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
