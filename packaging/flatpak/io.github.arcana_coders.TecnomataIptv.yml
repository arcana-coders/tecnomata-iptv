app-id: io.github.arcana_coders.TecnomataIptv
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
# PySide6/Qt6 come from the official BaseApp instead of pip/source, so we
# never build Qt ourselves. https://github.com/flathub/io.qt.PySide.BaseApp
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: tecnomata-iptv

cleanup-commands:
  - /app/cleanup-BaseApp.sh

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Secret Service / GNOME Keyring: the app stores the Xtream account there,
  # never on disk. No broader D-Bus access is requested.
  - --talk-name=org.freedesktop.secrets
  # MPRIS: publishes only the playing title and playback state, never URLs.
  - --own-name=org.mpris.MediaPlayer2.io.github.arcana_coders.TecnomataIptv

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/doc
  - '*.la'
  - '*.a'

modules:
  # --- Media stack: libmpv is not part of org.freedesktop.Platform, so it
  # is built from source here. Config trimmed down from the upstream
  # io.mpv.Mpv Flathub manifest to what a single embedded playback widget
  # actually needs (no CLI player binary, no disc/scripting/exotic-hardware
  # support) — see docs/screenshots and README for what the app does.
  #
  # Order matters: libass/uchardet/zimg must exist before ffmpeg configures
  # against them, and ffmpeg must exist before mpv configures against it.
  - name: libass
    buildsystem: autotools
    cleanup:
      - /include
      - /lib/pkgconfig
    config-opts:
      - --disable-static
      - --enable-asm
      - --enable-harfbuzz
      - --enable-fontconfig
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.5
        commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d
        x-checker-data:
          type: git
          tag-pattern: ^(\d\.\d{1,3}\.\d{1,2})$

  - name: uchardet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_STATIC=0
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
        sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0
        x-checker-data:
          type: html
          url: https://www.freedesktop.org/software/uchardet/releases/
          version-pattern: uchardet-(\d\.\d+\.?\d*).tar.xz
          url-template: https://www.freedesktop.org/software/uchardet/releases/uchardet-$version.tar.xz

  - name: zimg
    buildsystem: autotools
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/doc
    sources:
      - type: archive
        archive-type: tar
        url: https://api.github.com/repos/sekrit-twc/zimg/tarball/release-3.0.6
        sha256: 15140e491c4ce9db5f02a038d8a1eb53e9151b55eeed06a2899425a6ebfef367
        x-checker-data:
          type: json
          url: https://api.github.com/repos/sekrit-twc/zimg/releases/latest
          url-query: .tarball_url
          version-query: .tag_name | sub("^release-"; "")
          timestamp-query: .published_at

  - name: ffmpeg
    buildsystem: autotools
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/ffmpeg/examples
    config-opts:
      - --disable-debug
      - --disable-doc
      - --disable-static
      - --enable-shared
      - --enable-gnutls
      - --enable-libass
      - --enable-libfreetype
      - --enable-libopus
      - --enable-libvorbis
      - --enable-libdav1d
      - --enable-libdrm
      - --enable-vaapi
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        commit: bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa
        tag: n9.0.1
        x-checker-data:
          type: git
          tag-pattern: ^n([\d.]{3,7})$

  - name: libplacebo
    # mpv 0.41 requires this unconditionally (its core GPU rendering path),
    # it's not an optional extra like the upstream io.mpv.Mpv module list
    # might suggest.
    buildsystem: meson
    config-opts:
      - -Dvulkan=enabled
      - -Dshaderc=enabled
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: hwdata
    # Build-time dependency of libdisplay-info (PNP vendor id database).
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/vcrhonek/hwdata/archive/refs/tags/v0.394.tar.gz
        sha256: b7c3fd7214a3b7c49d2661db127a712dc11cffd1799f793947aa1cb20aaf3298

  - name: libdisplay-info
    # Also a hard mpv 0.41 dependency (DRM/Wayland color/HDR metadata), not
    # optional despite being easy to mistake for exotic-hardware-only.
    buildsystem: meson
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.2.0/libdisplay-info-0.2.0.tar.gz
        sha256: f7331fcaf5527251b84c8fb84238d06cd2f458422ce950c80e86c72927aa8c2b

  - name: libXpresent
    # X11 vsync/frame-presentation timing extension mpv's x11 backend needs.
    buildsystem: autotools
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xorg/lib/libxpresent.git
        tag: libXpresent-1.0.2
        commit: 4d92149372461bf575e8a09b1064a2884c38c3aa
        x-checker-data:
          type: git
          tag-pattern: ^libXpresent-([\d.]+)$

  - name: mpv
    buildsystem: meson
    config-opts:
      # Library only — no standalone `mpv` CLI binary, no disc/scripting/
      # exotic-hardware support this app never uses.
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dwerror=false
      - -Dalsa=enabled
      - -Dpulse=enabled
      - -Dpipewire=enabled
      - -Dwayland=enabled
      - -Dx11=enabled
      - -Degl=enabled
      - -Degl-wayland=enabled
      - -Degl-x11=enabled
      - -Degl-drm=enabled
      - -Dgl=enabled
      - -Dgl-x11=enabled
      - -Dplain-gl=enabled
      - -Ddrm=enabled
      - -Dgbm=enabled
      - -Dvaapi=enabled
      - -Dvaapi-drm=enabled
      - -Dvaapi-wayland=enabled
      - -Dvaapi-x11=enabled
      - -Dvdpau=enabled
      - -Dvdpau-gl-x11=enabled
      - -Ddmabuf-wayland=enabled
      - -Dvector=enabled
      - -Diconv=enabled
      - -Dlcms2=enabled
      - -Djpeg=enabled
      - -Dzimg=enabled
      - -Duchardet=enabled
      - -Dzlib=enabled
      - -Dxv=enabled
      - -Dcdda=disabled
      - -Dcplugins=disabled
      - -Dcuda-hwaccel=disabled
      - -Dcuda-interop=disabled
      - -Ddvbin=disabled
      - -Ddvdnav=disabled
      - -Djavascript=disabled
      - -Djack=disabled
      - -Dlibarchive=disabled
      - -Dlibavdevice=disabled
      - -Dlibbluray=disabled
      - -Dlua=disabled
      - -Dopenal=disabled
      - -Drubberband=disabled
      - -Dvapoursynth=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-main-source: true

  # --- Python dependencies, generated with flatpak-pip-generator so the
  # sandboxed (network-less) build can pip-install exact pinned wheels.
  - python3-modules.yaml

  # --- The app itself.
  - name: tecnomata-iptv
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix=/app .
      - install -Dm644 packaging/flatpak/io.github.arcana_coders.TecnomataIptv.metainfo.xml
        /app/share/metainfo/io.github.arcana_coders.TecnomataIptv.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.arcana_coders.TecnomataIptv.desktop
        /app/share/applications/io.github.arcana_coders.TecnomataIptv.desktop
      - install -Dm644 packaging/flatpak/io.github.arcana_coders.TecnomataIptv.svg
        /app/share/icons/hicolor/scalable/apps/io.github.arcana_coders.TecnomataIptv.svg
    sources:
      - type: git
        url: https://github.com/arcana-coders/tecnomata-iptv.git
        commit: eb93822691f5acff290552b7203314c2cc47134c
